name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Preparar clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.UPGRADE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upgrade.jks"
            echo "UPGRADE_KEYSTORE_PATH=$RUNNER_TEMP/upgrade.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto UPGRADE_KEYSTORE_B64: esta APK no podrá actualizar a las anteriores."
          fi

      - name: Compilar APK
        env:
          UPGRADE_KEY_PASSWORD: ${{ secrets.UPGRADE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk UpGrade-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UpGrade-v${{ github.run_number }}
          path: UpGrade-v${{ github.run_number }}.apk

      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: UpGrade v${{ github.run_number }}
          body: "Descarga el archivo .apk de abajo e instálalo encima de la versión anterior (no se pierden datos)."
          files: UpGrade-v${{ github.run_number }}.apk
          make_latest: true
